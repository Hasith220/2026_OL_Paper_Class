<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening your student report</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f2f6fb; color:#182a43; font:17px/1.7 system-ui,"Nirmala UI",sans-serif; }
    main { max-width:540px; margin:24px; padding:30px; background:white; border:1px solid #dce5ef; border-radius:18px; }
    h1 { margin:0 0 12px; font-size:25px; }
    p { margin:0 0 20px; }
    a { display:inline-block; padding:11px 18px; border-radius:10px; background:#2666e8; color:white; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Opening your report…</h1>
    <p id="hint">ඔබේ අලුත් ප්‍රගති වාර්තාව වෙත යොමු කරමින් පවතී.</p>
    <a id="continue-link" href="https://hasith220.github.io/2026_OL_Paper_Class/report.html">Open report →</a>
    <noscript><p>කරුණාකර JavaScript සක්‍රිය කර පරණ SMS link එක නැවත විවෘත කරන්න.</p></noscript>
  </main>
  <script>
    (() => {
      const target = new URL('https://hasith220.github.io/2026_OL_Paper_Class/report.html');
      // Preserve the original student ID, any other query parameters and anchor.
      target.search = window.location.search;
      target.hash = window.location.hash;
      document.getElementById('continue-link').href = target.href;

      // Prevent a reload loop if this file is accidentally pasted into the new site.
      if (window.location.origin === target.origin && window.location.pathname === target.pathname) {
        document.getElementById('heading').textContent = 'Redirect file is in the wrong repository';
        document.getElementById('hint').textContent = 'මෙම code එක 2026_mcq_Paper_Class repository එකේ report.html සඳහා පමණයි. මෙතැන අලුත් dashboard report.html එක නැවත දාන්න.';
        document.getElementById('continue-link').hidden = true;
        return;
      }
      window.location.replace(target.href);
    })();
  </script>
</body>
</html>
